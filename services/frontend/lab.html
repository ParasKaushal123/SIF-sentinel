<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Luck Lab · SIF Sentinel</title>
<link rel="stylesheet" href="css/sentinel.css">
<style>
  body { padding-left: 200px; padding-top: 60px; }
  .lab { max-width: 1000px; margin: 40px auto; }
</style>
</head>
<body>

<div id="header">
  <div class="brand">SIF Sentinel</div>
  <div><div class="ds">OIL India · v2026.03</div></div>
</div>

<div id="dock">
  <button class="nav" onclick="location.href='index.html'" data-dest="Command Centre"><span><i class="sc-icon">map</i></span></button>
  <button class="nav" onclick="location.href='insights.html'" data-dest="Insights"><span><i class="sc-icon">analytics</i></span></button>
  <button class="nav" onclick="location.href='import.html'" data-dest="Import"><span><i class="sc-icon">upload</i></span></button>
  <button class="nav on" data-dest="Luck Lab"><span><i class="sc-icon">science</i></span></button>
</div>

<div class="lab glass glass-ring" style="padding:40px;">
  <div class="kicker">Analysis Sandbox</div>
  <h2>Luck Lab</h2>
  <p style="margin-top:20px; color:var(--ink-2);">Compare two narratives side-by-side to observe outcome-resistant classification.</p>
  
  <div style="display:flex; gap:20px; margin-top: 20px;">
    <textarea style="flex:1; height:200px; padding:10px; border-radius:4px; border:1px solid var(--ink-3); background:var(--paper); color:var(--ink);" placeholder="Left narrative..."></textarea>
    <textarea style="flex:1; height:200px; padding:10px; border-radius:4px; border:1px solid var(--ink-3); background:var(--paper); color:var(--ink);" placeholder="Right narrative..."></textarea>
  </div>
  
  <button class="tbtn pri" style="margin-top: 20px;">Run Comparison</button>
</div>

</body>
</html>
